[package]
name = "devnull"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dev-dependencies]
proptest = "1.11.0"
