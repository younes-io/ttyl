[package]
name = "ttyl"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A terminal client for the dev-null.sh social network"
repository = "https://github.com/younes-io/ttyl"
homepage = "https://github.com/younes-io/ttyl"
readme = "README.md"
keywords = ["tui", "terminal", "social", "client"]
categories = ["command-line-utilities"]
include = ["/src", "/LICENSE", "/NOTICE", "/README.md"]

[dependencies]
base64ct = { version = "1.8.3", features = ["alloc"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "getrandom", "std"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = "3.4.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[dev-dependencies]
proptest = "1.11.0"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
